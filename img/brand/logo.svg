<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1228"/>
      <stop offset="50%" stop-color="#080c1d"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- Bolt/X gradient -->
    <linearGradient id="boltGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="boltGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="specular3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad3)" stroke="#1e1b4b" stroke-width="2.5"/>
  <rect x="9" y="9" width="238" height="119" rx="55" fill="url(#specular3)" opacity="0.35"/>

  <!-- Glow effect -->
  <circle cx="128" cy="128" r="62" fill="#06b6d4" opacity="0.22" filter="url(#neonGlow3)"/>

  <!-- High-voltage cyber 'X' / Lightning blade symbol -->
  <!-- Top-left to bottom-right dynamic stroke -->
  <path d="M 60 52 
           L 114 52 
           L 196 204 
           L 142 204 Z" 
        fill="url(#boltGradBottom)"/>

  <!-- Crossing lightning chevron (Top-right through center to bottom-left) -->
  <path d="M 196 52 
           L 146 52 
           L 100 126 
           L 132 138 
           L 60 204 
           L 96 204 
           L 156 122 
           L 126 112 Z" 
        fill="url(#boltGradTop)"/>

  <!-- Central Energy Spark Diamond -->
  <polygon points="128,114 140,128 128,142 116,128" fill="url(#sparkGrad)"/>
  <circle cx="196" cy="52" r="5" fill="#22d3ee"/>
  <circle cx="60" cy="204" r="5" fill="#ec4899"/>
</svg>
