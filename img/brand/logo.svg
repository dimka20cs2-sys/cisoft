<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="akeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1328"/>
      <stop offset="50%" stop-color="#090c1b"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- 'A' Left Pillar: Cyan to Deep Indigo -->
    <linearGradient id="akeeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- 'A' Right Pillar: Indigo to Neon Violet/Fuchsia -->
    <linearGradient id="akeeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Tech Crossbar / Energy Core -->
    <linearGradient id="akeeCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Specular Top Sheen -->
    <linearGradient id="akeeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow -->
    <filter id="akeeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#akeeBg)" stroke="#272559" stroke-width="2.5"/>
  <rect x="9" y="9" width="238" height="119" rx="55" fill="url(#akeeSheen)" opacity="0.4"/>

  <!-- Subtle glow aura -->
  <circle cx="128" cy="128" r="64" fill="#6366f1" opacity="0.25" filter="url(#akeeGlow)"/>

  <!-- Tech 'A' Monogram:
       Peak: (128, 48)
       Bottom-Left: (54, 204)
       Bottom-Right: (202, 204)
  -->

  <!-- Left Cyber Pillar -->
  <path d="M 128 48 
           L 102 96 
           L 78 144 
           L 54 204 
           L 96 204 
           L 112 168 
           L 128 136 
           Z" 
        fill="url(#akeeLeft)"/>

  <!-- Right Cyber Pillar -->
  <path d="M 128 48 
           L 128 136 
           L 144 168 
           L 160 204 
           L 202 204 
           L 178 144 
           L 154 96 
           Z" 
        fill="url(#akeeRight)"/>

  <!-- Inner Chevron / Floating Quantum Tech Core -->
  <polygon points="128,88 152,138 128,154 104,138" fill="#0c1228" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Glowing Horizontal Tech Bridge (Crossbar) -->
  <polygon points="92,154 164,154 156,168 100,168" fill="url(#akeeCore)"/>

  <!-- Micro-circuits / Diamond Sparks for high-tech feeling -->
  <polygon points="128,112 136,124 128,136 120,124" fill="#ffffff" opacity="0.95"/>
  <circle cx="128" cy="50" r="4.5" fill="#38bdf8"/>
  <circle cx="56" cy="204" r="4" fill="#22d3ee"/>
  <circle cx="200" cy="204" r="4" fill="#d946ef"/>
</svg>
